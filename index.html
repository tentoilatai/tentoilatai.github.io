<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tai Tran Viet</title>
  <!-- Import Google Fonts - Righteous -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Righteous:wght@400&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" href="https://www.gstatic.com/devrel-devsite/prod/v6dc4611c4232bd02b2b914c4948f523846f90835f230654af18f87f75fe9f73c/web/images/touchicon-180.png">
  <link rel="shortcut icon" href="https://www.gstatic.com/devrel-devsite/prod/v6dc4611c4232bd02b2b914c4948f523846f90835f230654af18f87f75fe9f73c/web/images/favicon.png">  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Righteous', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow-x: hidden;
      overflow: hidden;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Loading Animation */
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, #007bff, #0056b3, #004085);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeOut 4s ease-in-out forwards;
    }

    .loader-content {
      text-align: center;
      color: white;
    }

    .loader h2 {
      font-size: clamp(4rem, 10vw, 8rem);
      font-weight: 400;
      font-family: 'Righteous', sans-serif;
      letter-spacing: -0.02em;
      margin: 0;
      background: linear-gradient(135deg, #ffffff, #f8f9fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeInScaleToHeader 4s ease-out forwards;
      opacity: 0;
      transform: scale(0.5);
    }

    @keyframes fadeInScaleToHeader {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }

      25% {
        opacity: 0.7;
        transform: scale(1.2);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }

      75% {
        opacity: 1;
        transform: scale(0.8) translateY(-20px);
      }

      100% {
        opacity: 0.3;
        transform: scale(0.3) translateY(-200px);
      }
    }

    @keyframes fadeOut {

      0%,
      75% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* Page Sections */
    .page-section {
      min-height: 100vh;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Page 1 */
    .page-1 {
      background: linear-gradient(135deg, #007bff 0%, #0056b3 50%, #004085 100%);
      color: white;
      text-align: center;
      flex-direction: column;
      justify-content: center;
      padding: 80px 20px 60px;
      height: 100vh;
      min-height: 100vh;
    }

    .page-header {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      animation: fadeInDown 1s ease-out 3.5s both;
    }

    .page-header h2 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 400;
      font-family: 'Righteous', sans-serif;
      letter-spacing: -0.01em;
      margin: 0;
      color: white;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .hero-content {
      z-index: 2;
      animation: fadeInUp 1s ease-out 3.5s both;
      margin: auto;
    }

    .hero-content h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 400;
      font-family: 'Righteous', sans-serif;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      animation: textGlow 3s ease-in-out infinite alternate;
    }

    .hero-content p {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 400;
      font-family: 'Righteous', sans-serif;
      letter-spacing: -0.01em;
      opacity: 0.9;
      margin-bottom: 15px;
    }

    .time-display {
      font-size: clamp(1rem, 2.5vw, 1.4rem) !important;
      font-weight: 400 !important;
      color: rgba(255, 255, 255, 0.8) !important;
      margin-bottom: 30px !important;
      font-family: 'Righteous', monospace !important;
      letter-spacing: 0.05em !important;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      animation: bounce 2s infinite;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }

    .scroll-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      font-family: 'Righteous', sans-serif;
      text-align: center;
      margin-bottom: 10px;
      animation: textPulse 2s ease-in-out infinite;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      letter-spacing: 0.5px;
    }

    .scroll-arrows {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .scroll-arrow {
      width: 35px;
      height: 35px;
      fill: white;
      opacity: 0.8;
      transition: all 0.3s ease;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      animation: arrowFloat 2s ease-in-out infinite;
    }

    .scroll-arrow:nth-child(1) {
      animation-delay: 0s;
      opacity: 0.9;
      --scale: 1;
    }

    .scroll-arrow:nth-child(2) {
      animation-delay: 0.2s;
      opacity: 0.7;
      --scale: 0.9;
    }

    .scroll-arrow:nth-child(3) {
      animation-delay: 0.4s;
      opacity: 0.5;
      --scale: 0.8;
    }

    .scroll-indicator:hover .scroll-arrow {
      opacity: 1;
      transform: scale(1.1);
      fill: #ffffff;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
    }

    .scroll-indicator:hover .scroll-text {
      color: #ffffff;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    /* Enhanced scroll indicator animations */
    @keyframes textPulse {
      0%, 100% {
        opacity: 0.9;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    @keyframes arrowFloat {
      0%, 100% {
        transform: translateY(0) scale(var(--scale, 1));
      }
      50% {
        transform: translateY(-8px) scale(var(--scale, 1));
      }
    }

    /* Floating Elements */
    .floating-elements {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .floating-shape {
      position: absolute;
      animation: float 6s ease-in-out infinite;
      opacity: 0.6;
    }

    .floating-circle {
      border-radius: 50%;
      background: linear-gradient(45deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .floating-square {
      background: linear-gradient(135deg, rgba(0, 123, 255, 0.2), rgba(0, 86, 179, 0.1));
      transform: rotate(45deg);
      box-shadow: 0 0 15px rgba(0, 123, 255, 0.2);
    }

    .floating-triangle {
      width: 0;
      height: 0;
      background: transparent;
      border-left: 30px solid transparent;
      border-right: 30px solid transparent;
      border-bottom: 52px solid rgba(255, 255, 255, 0.1);
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
    }

    .floating-hexagon {
      width: 60px;
      height: 34.64px;
      background: linear-gradient(60deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
      position: relative;
    }

    .floating-hexagon:before,
    .floating-hexagon:after {
      content: "";
      position: absolute;
      width: 0;
      border-left: 30px solid transparent;
      border-right: 30px solid transparent;
    }

    .floating-hexagon:before {
      bottom: 100%;
      border-bottom: 17.32px solid rgba(255, 255, 255, 0.1);
    }

    .floating-hexagon:after {
      top: 100%;
      border-top: 17.32px solid rgba(255, 255, 255, 0.1);
    }

    /* Individual shapes positioning */
    .circle-1 {
      width: 80px;
      height: 80px;
      top: 15%;
      left: 8%;
      animation-delay: 0s;
    }

    .circle-2 {
      width: 120px;
      height: 120px;
      top: 65%;
      right: 12%;
      animation-delay: 2s;
    }

    .circle-3 {
      width: 60px;
      height: 60px;
      top: 85%;
      left: 18%;
      animation-delay: 4s;
    }

    .circle-4 {
      width: 90px;
      height: 90px;
      top: 25%;
      right: 25%;
      animation-delay: 1s;
    }

    .circle-5 {
      width: 70px;
      height: 70px;
      top: 45%;
      left: 5%;
      animation-delay: 3s;
    }

    .square-1 {
      width: 50px;
      height: 50px;
      top: 30%;
      left: 75%;
      animation-delay: 1.5s;
    }

    .square-2 {
      width: 40px;
      height: 40px;
      top: 70%;
      left: 60%;
      animation-delay: 3.5s;
    }

    .square-3 {
      width: 35px;
      height: 35px;
      top: 10%;
      left: 45%;
      animation-delay: 0.5s;
    }

    .triangle-1 {
      top: 20%;
      right: 8%;
      animation-delay: 2.5s;
    }

    .triangle-2 {
      top: 75%;
      right: 35%;
      animation-delay: 4.5s;
      transform: scale(0.8);
    }

    .hexagon-1 {
      top: 40%;
      right: 5%;
      animation-delay: 1.8s;
    }

    .hexagon-2 {
      top: 12%;
      left: 25%;
      animation-delay: 3.2s;
    }

    /* Particle System */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: particleFloat 8s linear infinite;
    }

    /* Mouse Follower Elements */
    .mouse-followers {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .mouse-follower {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      opacity: 0;
    }

    /* Animated Background Pattern */
    .animated-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 123, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 70%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
      animation: bgPulse 8s ease-in-out infinite;
    }

    /* Geometric Grid */
    .geometric-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      opacity: 0.3;
    }

    /* Floating Lines */
    .floating-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .floating-line {
      position: absolute;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: lineFloat 10s linear infinite;
    }

    .line-1 {
      width: 200px;
      top: 25%;
      left: -200px;
      animation-delay: 0s;
    }

    .line-2 {
      width: 150px;
      top: 60%;
      left: -150px;
      animation-delay: 4s;
    }

    .line-3 {
      width: 180px;
      top: 80%;
      left: -180px;
      animation-delay: 7s;
    }

    /* Glowing Orbs */
    .glowing-orbs {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .glowing-orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2), rgba(0, 123, 255, 0.1), transparent);
      animation: orbPulse 4s ease-in-out infinite;
      filter: blur(1px);
    }

    .orb-1 {
      width: 150px;
      height: 150px;
      top: 10%;
      right: 10%;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 100px;
      height: 100px;
      bottom: 20%;
      left: 15%;
      animation-delay: 2s;
    }

    .orb-3 {
      width: 120px;
      height: 120px;
      top: 50%;
      left: 70%;
      animation-delay: 1s;
    }

    /* Page 2 */
    .page-2 {
      background: linear-gradient(45deg, #f8f9fa 0%, #e9ecef 100%);
      color: #333;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .contact-container {
      max-width: 1000px;
      width: 90%;
      text-align: center;
      animation: fadeInUp 1s ease-out;
    }

    .contact-title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 400;
      font-family: 'Righteous', sans-serif;
      letter-spacing: -0.02em;
      margin-bottom: 50px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .contact-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 50px;
      flex-wrap: nowrap;
      max-width: 100%;
      overflow-x: auto;
      padding: 0 20px;
    }

    .contact-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 123, 255, 0.1);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      width: 200px;
      height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex-shrink: 0;
      text-decoration: none;
      color: inherit;
    }

    .contact-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 123, 255, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .contact-card:hover::before {
      left: 100%;
    }

    .contact-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 123, 255, 0.2);
    }

    .contact-icon {
      width: 50px;
      height: 50px;
      margin: 0 auto 15px;
      padding: 12px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contact-icon svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    .contact-card h3 {
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      font-weight: 400;
      font-family: 'Righteous', sans-serif;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      color: #333;
    }

    .contact-card p {
      color: #666;
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      font-weight: 400;
      font-family: 'Righteous', sans-serif;
      word-break: break-all;
      line-height: 1.3;
    }

    .contact-card a {
      color: #007bff;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .contact-card a:hover {
      color: #0056b3;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .social-link {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .social-link::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transition: all 0.5s ease;
      transform: translate(-50%, -50%);
    }

    .social-link:hover::before {
      width: 100%;
      height: 100%;
    }

    .social-link:hover {
      transform: scale(1.1) rotate(5deg);
    }

    .social-link svg {
      width: 30px;
      height: 30px;
      fill: white;
      z-index: 2;
      position: relative;
    }

    /* Animations */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes textGlow {
      from {
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      to {
        text-shadow: 0 4px 30px rgba(255, 255, 255, 0.2);
      }
    }

    @keyframes bounce {

      0%,
      20%,
      50%,
      80%,
      100% {
        transform: translateX(-50%) translateY(0);
      }

      40% {
        transform: translateX(-50%) translateY(-10px);
      }

      60% {
        transform: translateX(-50%) translateY(-5px);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-20px) rotate(180deg);
      }
    }

    @keyframes particleFloat {
      0% {
        transform: translateY(100vh) translateX(0px) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) translateX(100px) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes bgPulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.7;
        transform: scale(1.05);
      }
    }

    @keyframes gridMove {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(50px, 50px);
      }
    }

    @keyframes lineFloat {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateX(calc(100vw + 200px));
        opacity: 0;
      }
    }

    @keyframes orbPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.3;
      }
      50% {
        transform: scale(1.2);
        opacity: 0.6;
      }
    }

    /* Cursor Trail Effect */
    .cursor-trail {
      position: fixed;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transition: all 0.3s ease;
      opacity: 0;
    }

    .cursor-trail.blue {
      background: rgba(0, 123, 255, 0.8);
    }

    /* Mouse Follower Colors */
    .mouse-follower {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      opacity: 0;
    }

    .mouse-follower.blue {
      background: radial-gradient(circle, rgba(0, 123, 255, 0.4), transparent);
    }

    /* Interactive Ripple Effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
      transform: scale(0);
      animation: rippleEffect 0.6s linear;
      pointer-events: none;
    }

    .ripple.blue {
      background: radial-gradient(circle, rgba(0, 123, 255, 0.4), transparent);
    }

    @keyframes rippleEffect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* Scroll Effects */
    .scroll-fade {
      opacity: 0;
      transform: translateY(50px);
      transition: all 0.8s ease;
    }

    .scroll-fade.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Scroll to top button */
    .scroll-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0;
      visibility: hidden;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
    }

    .scroll-to-top.visible {
      opacity: 1;
      visibility: visible;
    }

    .scroll-to-top:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(0, 123, 255, 0.6);
    }

    .scroll-to-top svg {
      width: 24px;
      height: 24px;
      fill: white;
      transform: rotate(180deg);
    }

  <script>
    // Function to set Japanese greeting based on time of day
    function setJapaneseGreeting() {
      const now = new Date();
      // Convert to GMT+7 (Vietnam/Thailand timezone)
      const gmt7Time = new Date(now.getTime() + (7 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60 * 1000));
      const hour = gmt7Time.getHours();
      const greetingElement = document.getElementById('japanese-greeting');
      
      let greeting = '';
      
      if (hour >= 5 && hour < 12) {
        // Morning: 5 AM - 12 PM
        greeting = 'おはようございます';
      } else if (hour >= 12 && hour < 18) {
        // Afternoon: 12 PM - 6 PM
        greeting = 'こんにちは';
      } else {
        // Evening/Night: 6 PM - 5 AM
        greeting = 'こんばんは';
      }
      
      greetingElement.textContent = greeting;
    }

    // Function to update GMT+7 time display
    function updateGMT7Time() {
      const now = new Date();
      // Convert to GMT+7 timezone
      const gmt7Time = new Date(now.getTime() + (7 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60 * 1000));
      
      const timeElement = document.getElementById('gmt-time');
      
      // Format time (HH:MM:SS)
      const hours = gmt7Time.getHours().toString().padStart(2, '0');
      const minutes = gmt7Time.getMinutes().toString().padStart(2, '0');
      const seconds = gmt7Time.getSeconds().toString().padStart(2, '0');
      const timeString = `${hours}:${minutes}:${seconds} GMT+7`;
      
      // Format date
      const options = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      };
      const dateString = gmt7Time.toLocaleDateString('en-US', options);
      
      timeElement.innerHTML = `${timeString}<br><small style="font-size: 0.8em; opacity: 0.7;">${dateString}</small>`;
    }

    // Update time every second
    function startClock() {
      updateGMT7Time();
      setInterval(updateGMT7Time, 1000);
    }

    // Set greeting and start clock when page loads
    document.addEventListener('DOMContentLoaded', () => {
      setJapaneseGreeting();
      startClock();
      initParticles();
      initMouseFollowers();
      createCursorTrail();
      
      // Update greeting every minute in case time zone changes
      setInterval(setJapaneseGreeting, 60000);
      
      // Observe elements for scroll animations
      const scrollElements = document.querySelectorAll('.scroll-fade');
      scrollElements.forEach(el => observer.observe(el));
    });

    // Smooth scrolling between pages
    function scrollToPage2() {
      document.getElementById('page2').scrollIntoView({
        behavior: 'smooth'
      });
    }

    function scrollToTop() {
      document.getElementById('page1').scrollIntoView({
        behavior: 'smooth'
      });
    }

    // Show/hide scroll to top button
    window.addEventListener('scroll', () => {
      const scrollToTopBtn = document.querySelector('.scroll-to-top');
      const scrolled = window.pageYOffset;

      if (scrolled > window.innerHeight / 2) {
        scrollToTopBtn.classList.add('visible');
      } else {
        scrollToTopBtn.classList.remove('visible');
      }

      // Parallax effect for floating elements
      const parallax = document.querySelectorAll('.floating-circle');
      parallax.forEach((circle, index) => {
        const speed = 0.5 + (index * 0.2);
        circle.style.transform = `translateY(${scrolled * speed}px) rotate(${scrolled * 0.1}deg)`;
      });
    });

    // Intersection Observer for scroll animations
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);

    // Add hover effects to contact cards
    document.querySelectorAll('.contact-card').forEach(card => {
      card.addEventListener('mouseenter', () => {
        card.style.transform = 'translateY(-10px) scale(1.02)';
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = 'translateY(0) scale(1)';
      });
    });

    // Add click animation to social links
    document.querySelectorAll('.social-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        link.style.transform = 'scale(0.9)';
        setTimeout(() => {
          link.style.transform = 'scale(1.1)';
          setTimeout(() => {
            link.style.transform = 'scale(1)';
            // Navigate to the actual link after animation
            window.open(link.href, '_blank');
          }, 150);
        }, 100);
      });
    });

    // Mouse movement parallax with enhanced effects
    let mouseX = 0, mouseY = 0;
    let followers = [];
    let particles = [];
    let cursorTrails = [];

    // Initialize particle system
    function initParticles() {
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        createParticle(particlesContainer);
      }
    }

    function createParticle(container) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 8 + 's';
      particle.style.animationDuration = (8 + Math.random() * 4) + 's';
      container.appendChild(particle);
      
      // Remove and recreate particle after animation
      setTimeout(() => {
        if (particle.parentNode) {
          particle.parentNode.removeChild(particle);
          createParticle(container);
        }
      }, 12000);
    }

    // Initialize mouse followers
    function initMouseFollowers() {
      const followersContainer = document.getElementById('mouseFollowers');
      for (let i = 0; i < 8; i++) {
        const follower = document.createElement('div');
        follower.className = 'mouse-follower';
        followersContainer.appendChild(follower);
        followers.push({
          element: follower,
          x: 0,
          y: 0,
          delay: i * 50
        });
      }
    }

    // Create cursor trail
    function createCursorTrail() {
      for (let i = 0; i < 10; i++) {
        const trail = document.createElement('div');
        trail.className = 'cursor-trail';
        document.body.appendChild(trail);
        cursorTrails.push({
          element: trail,
          x: 0,
          y: 0,
          life: 0
        });
      }
    }

    // Update cursor trail
    function updateCursorTrail(x, y) {
      cursorTrails.forEach((trail, index) => {
        setTimeout(() => {
          trail.x = x;
          trail.y = y;
          trail.element.style.left = trail.x + 'px';
          trail.element.style.top = trail.y + 'px';
          trail.element.style.opacity = (10 - index) / 10;
        }, index * 30);
      });
    }

    // Create ripple effect with color based on current page
    function createRipple(x, y) {
      const ripple = document.createElement('div');
      const currentPage = getCurrentPage();
      
      ripple.className = currentPage === 1 ? 'ripple' : 'ripple blue';
      ripple.style.left = (x - 25) + 'px';
      ripple.style.top = (y - 25) + 'px';
      ripple.style.width = '50px';
      ripple.style.height = '50px';
      
      const targetPage = currentPage === 1 ? '.page-1' : '.page-2';
      document.querySelector(targetPage).appendChild(ripple);
      
      setTimeout(() => {
        if (ripple.parentNode) {
          ripple.parentNode.removeChild(ripple);
        }
      }, 600);
    }

    // Get current page based on scroll position
    function getCurrentPage() {
      const scrolled = window.pageYOffset;
      return scrolled < window.innerHeight / 2 ? 1 : 2;
    }

    // Update cursor effects color based on current page
    function updateCursorColors() {
      const currentPage = getCurrentPage();
      const isBlue = currentPage === 2;
      
      // Update cursor trails
      cursorTrails.forEach(trail => {
        if (isBlue) {
          trail.element.classList.add('blue');
        } else {
          trail.element.classList.remove('blue');
        }
      });
      
      // Update mouse followers
      followers.forEach(follower => {
        if (isBlue) {
          follower.element.classList.add('blue');
        } else {
          follower.element.classList.remove('blue');
        }
      });
    }

    // Enhanced mouse movement handler
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX / window.innerWidth;
      mouseY = e.clientY / window.innerHeight;
      
      // Update cursor trail
      updateCursorTrail(e.clientX, e.clientY);
      
      // Update mouse followers
      followers.forEach((follower, index) => {
        setTimeout(() => {
          const targetX = e.clientX - 10;
          const targetY = e.clientY - 10;
          follower.element.style.left = targetX + 'px';
          follower.element.style.top = targetY + 'px';
          follower.element.style.opacity = '1';
          follower.element.style.transform = `scale(${1 - index * 0.1})`;
        }, follower.delay);
      });

      // Enhanced parallax for floating elements
      document.querySelectorAll('.floating-shape').forEach((shape, index) => {
        const speed = (index + 1) * 3;
        const x = (mouseX - 0.5) * speed;
        const y = (mouseY - 0.5) * speed;
        const rotation = (mouseX - 0.5) * 20;
        shape.style.transform += ` translate(${x}px, ${y}px) rotate(${rotation}deg)`;
      });

      // Parallax for glowing orbs
      document.querySelectorAll('.glowing-orb').forEach((orb, index) => {
        const speed = (index + 1) * 2;
        const x = (mouseX - 0.5) * speed;
        const y = (mouseY - 0.5) * speed;
        orb.style.transform += ` translate(${x}px, ${y}px)`;
      });

      // Dynamic background gradient based on mouse position
      const page1 = document.querySelector('.page-1');
      const hue1 = 220 + (mouseX * 40);
      const hue2 = 200 + (mouseY * 60);
      page1.style.background = `linear-gradient(135deg, hsl(${hue1}, 100%, 50%) 0%, hsl(${hue2}, 100%, 35%) 50%, hsl(${hue1 - 20}, 100%, 25%) 100%)`;
    });

    // Click effect with color based on current page
    document.addEventListener('click', (e) => {
      createRipple(e.clientX, e.clientY);
    });

    // Enhanced scroll effects
    window.addEventListener('scroll', () => {
      const scrollToTopBtn = document.querySelector('.scroll-to-top');
      const scrolled = window.pageYOffset;

      if (scrolled > window.innerHeight / 2) {
        scrollToTopBtn.classList.add('visible');
      } else {
        scrollToTopBtn.classList.remove('visible');
      }

      // Update cursor colors based on current page
      updateCursorColors();

      // Enhanced parallax effect for floating elements
      const parallax = document.querySelectorAll('.floating-shape');
      parallax.forEach((shape, index) => {
        const speed = 0.5 + (index * 0.1);
        const yPos = scrolled * speed;
        const rotation = scrolled * 0.2;
        shape.style.transform = `translateY(${yPos}px) rotate(${rotation}deg)`;
      });

      // Parallax for geometric grid
      const grid = document.querySelector('.geometric-grid');
      if (grid) {
        grid.style.transform = `translate(${scrolled * 0.1}px, ${scrolled * 0.1}px)`;
      }

      // Parallax for animated background
      const animatedBg = document.querySelector('.animated-bg');
      if (animatedBg) {
        animatedBg.style.transform = `translateY(${scrolled * 0.3}px)`;
      }
    });

    // Initialize all effects when page loads
    document.addEventListener('DOMContentLoaded', () => {
      // Always scroll to top on page load/reload
      window.scrollTo(0, 0);
      
      setJapaneseGreeting();
      startClock();
      initParticles();
      initMouseFollowers();
      createCursorTrail();
      updateCursorColors(); // Set initial cursor colors
      
      // Update greeting every minute
      setInterval(setJapaneseGreeting, 60000);
      
      // Observe elements for scroll animations
      const scrollElements = document.querySelectorAll('.scroll-fade');
      scrollElements.forEach(el => observer.observe(el));
    });

    // Ensure page always starts at top on reload
    window.addEventListener('beforeunload', () => {
      window.scrollTo(0, 0);
    });

    // Additional scroll to top on page show (handles back/forward navigation)
    window.addEventListener('pageshow', () => {
      window.scrollTo(0, 0);
    });
  </script>
</body>

</html>
