  <link rel="apple-touch-icon" href="https://www.gstatic.com/devrel-devsite/prod/v6dc4611c4232bd02b2b914c4948f523846f90835f230654af18f87f75fe9f73c/web/images/touchicon-180.png">
  <link rel="shortcut icon" href="https://www.gstatic.com/devrel-devsite/prod/v6dc4611c4232bd02b2b914c4948f523846f90835f230654af18f87f75fe9f73c/web/images/favicon.png">  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      overflow-x: hidden;
      scroll-behavior: smooth;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Loading Animation */
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, #007bff, #0056b3, #004085);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeOut 4s ease-in-out forwards;
    }

    .loader-content {
      text-align: center;
      color: white;
    }

    .loader h2 {
      font-size: clamp(4rem, 10vw, 8rem);
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      letter-spacing: -0.02em;
      margin: 0;
      background: linear-gradient(135deg, #ffffff, #f8f9fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeInScaleToHeader 4s ease-out forwards;
      opacity: 0;
      transform: scale(0.5);
    }

    @keyframes fadeInScaleToHeader {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }

      25% {
        opacity: 0.7;
        transform: scale(1.2);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }

      75% {
        opacity: 1;
        transform: scale(0.8) translateY(-20px);
      }

      100% {
        opacity: 0.3;
        transform: scale(0.3) translateY(-200px);
      }
    }

    @keyframes fadeOut {

      0%,
      75% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* Page Sections */
    .page-section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Page 1 */
    .page-1 {
      background: linear-gradient(135deg, #007bff 0%, #0056b3 50%, #004085 100%);
      color: white;
      text-align: center;
      flex-direction: column;
      justify-content: center;
      padding-top: 50px;
    }

    .page-header {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      animation: fadeInDown 1s ease-out 3.5s both;
    }

    .page-header h2 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      letter-spacing: -0.01em;
      margin: 0;
      color: white;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .hero-content {
      z-index: 2;
      animation: fadeInUp 1s ease-out 3.5s both;
      margin: auto;
    }

    .hero-content h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      animation: textGlow 3s ease-in-out infinite alternate;
    }

    .hero-content p {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 400;
      font-family: 'Inter', sans-serif;
      letter-spacing: -0.01em;
      opacity: 0.9;
      margin-bottom: 15px;
    }

    .time-display {
      font-size: clamp(1rem, 2.5vw, 1.4rem) !important;
      font-weight: 500 !important;
      color: rgba(255, 255, 255, 0.8) !important;
      margin-bottom: 30px !important;
      font-family: 'Inter', monospace !important;
      letter-spacing: 0.05em !important;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      animation: bounce 2s infinite;
      cursor: pointer;
    }

    .scroll-arrow {
      width: 30px;
      height: 30px;
      fill: white;
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }

    .scroll-arrow:hover {
      opacity: 1;
    }

    /* Floating Elements */
    .floating-elements {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .floating-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 6s ease-in-out infinite;
    }

    .circle-1 {
      width: 80px;
      height: 80px;
      top: 20%;
      left: 10%;
      animation-delay: 0s;
    }

    .circle-2 {
      width: 120px;
      height: 120px;
      top: 60%;
      right: 15%;
      animation-delay: 2s;
    }

    .circle-3 {
      width: 60px;
      height: 60px;
      top: 80%;
      left: 20%;
      animation-delay: 4s;
    }

    /* Page 2 */
    .page-2 {
      background: linear-gradient(45deg, #f8f9fa 0%, #e9ecef 100%);
      color: #333;
    }

    .contact-container {
      max-width: 800px;
      width: 90%;
      text-align: center;
      animation: fadeInUp 1s ease-out;
    }

    .contact-title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 800;
      font-family: 'Inter', sans-serif;
      letter-spacing: -0.02em;
      margin-bottom: 50px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .contact-grid {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 50px;
      flex-wrap: nowrap;
      max-width: 100%;
      overflow-x: auto;
      padding: 0 20px;
    }

    .contact-card {
      background: white;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 123, 255, 0.1);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      width: 180px;
      height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex-shrink: 0;
    }

    .contact-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 123, 255, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .contact-card:hover::before {
      left: 100%;
    }

    .contact-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 123, 255, 0.2);
    }

    .contact-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 10px;
      padding: 10px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contact-icon svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .contact-card h3 {
      font-size: clamp(0.8rem, 2.5vw, 1rem);
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      letter-spacing: -0.01em;
      margin-bottom: 5px;
      color: #333;
    }

    .contact-card p {
      color: #666;
      font-size: clamp(0.7rem, 2vw, 0.85rem);
      font-weight: 400;
      font-family: 'Inter', sans-serif;
      word-break: break-all;
      line-height: 1.2;
    }

    .contact-card a {
      color: #007bff;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .contact-card a:hover {
      color: #0056b3;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .social-link {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .social-link::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transition: all 0.5s ease;
      transform: translate(-50%, -50%);
    }

    .social-link:hover::before {
      width: 100%;
      height: 100%;
    }

    .social-link:hover {
      transform: scale(1.1) rotate(5deg);
    }

    .social-link svg {
      width: 30px;
      height: 30px;
      fill: white;
      z-index: 2;
      position: relative;
    }

    /* Animations */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-30px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes textGlow {
      from {
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      to {
        text-shadow: 0 4px 30px rgba(255, 255, 255, 0.2);
      }
    }

    @keyframes bounce {

      0%,
      20%,
      50%,
      80%,
      100% {
        transform: translateX(-50%) translateY(0);
      }

      40% {
        transform: translateX(-50%) translateY(-10px);
      }

      60% {
        transform: translateX(-50%) translateY(-5px);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(180deg);
      }
    }

    /* Scroll Effects */
    .scroll-fade {
      opacity: 0;
      transform: translateY(50px);
      transition: all 0.8s ease;
    }

    .scroll-fade.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Scroll to top button */
    .scroll-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #007bff, #0056b3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0;
      visibility: hidden;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
    }

    .scroll-to-top.visible {
      opacity: 1;
      visibility: visible;
    }

    .scroll-to-top:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(0, 123, 255, 0.6);
    }

    .scroll-to-top svg {
      width: 24px;
      height: 24px;
      fill: white;
      transform: rotate(180deg);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .page-header h2 {
        font-size: 1.8rem;
        top: 20px;
      }

      .hero-content {
        margin: auto;
      }

      .contact-grid {
        gap: 10px;
        padding: 0 10px;
      }

      .contact-card {
        width: 160px;
        height: 140px;
        padding: 12px;
      }

      .social-links {
        gap: 15px;
      }

      .social-link {
        width: 50px;
        height: 50px;
      }

      .social-link svg {
        width: 25px;
        height: 25px;
      }

      .scroll-to-top {
        bottom: 20px;
        right: 20px;
        width: 45px;
        height: 45px;
      }
    }

    @media (max-width: 480px) {
      .page-header h2 {
        font-size: 1.5rem;
        top: 15px;
      }

      .hero-content {
        margin: auto;
      }

      .hero-content h1 {
        font-size: 2.5rem;
      }

      .contact-title {
        font-size: 2rem;
      }

      .contact-card {
        width: 140px;
        height: 120px;
        padding: 10px;
      }

      .contact-grid {
        gap: 8px;
        padding: 0 5px;
      }

      .contact-icon {
        width: 35px;
        height: 35px;
        margin-bottom: 8px;
      }

      .contact-icon svg {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>

  </section>

  <script>
    // Function to set Japanese greeting based on time of day
    function setJapaneseGreeting() {
      const now = new Date();
      // Convert to GMT+7 (Vietnam/Thailand timezone)
      const gmt7Time = new Date(now.getTime() + (7 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60 * 1000));
      const hour = gmt7Time.getHours();
      const greetingElement = document.getElementById('japanese-greeting');
      
      let greeting = '';
      
      if (hour >= 5 && hour < 12) {
        // Morning: 5 AM - 12 PM
        greeting = 'おはようございます';
      } else if (hour >= 12 && hour < 18) {
        // Afternoon: 12 PM - 6 PM
        greeting = 'こんにちは';
      } else {
        // Evening/Night: 6 PM - 5 AM
        greeting = 'こんばんは';
      }
      
      greetingElement.textContent = greeting;
    }

    // Function to update GMT+7 time display
    function updateGMT7Time() {
      const now = new Date();
      // Convert to GMT+7 timezone
      const gmt7Time = new Date(now.getTime() + (7 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60 * 1000));
      
      const timeElement = document.getElementById('gmt-time');
      
      // Format time (HH:MM:SS)
      const hours = gmt7Time.getHours().toString().padStart(2, '0');
      const minutes = gmt7Time.getMinutes().toString().padStart(2, '0');
      const seconds = gmt7Time.getSeconds().toString().padStart(2, '0');
      const timeString = `${hours}:${minutes}:${seconds} GMT+7`;
      
      // Format date
      const options = {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      };
      const dateString = gmt7Time.toLocaleDateString('en-US', options);
      
      timeElement.innerHTML = `${timeString}<br><small style="font-size: 0.8em; opacity: 0.7;">${dateString}</small>`;
    }

    // Update time every second
    function startClock() {
      updateGMT7Time();
      setInterval(updateGMT7Time, 1000);
    }

    // Set greeting and start clock when page loads
    document.addEventListener('DOMContentLoaded', () => {
      setJapaneseGreeting();
      startClock();
      // Update greeting every minute in case time zone changes
      setInterval(setJapaneseGreeting, 60000);
    });

    // Smooth scrolling between pages
    function scrollToPage2() {
      document.getElementById('page2').scrollIntoView({
        behavior: 'smooth'
      });
    }

    function scrollToTop() {
      document.getElementById('page1').scrollIntoView({
        behavior: 'smooth'
      });
    }

    // Show/hide scroll to top button
    window.addEventListener('scroll', () => {
      const scrollToTopBtn = document.querySelector('.scroll-to-top');
      const scrolled = window.pageYOffset;

      if (scrolled > window.innerHeight / 2) {
        scrollToTopBtn.classList.add('visible');
      } else {
        scrollToTopBtn.classList.remove('visible');
      }

      // Parallax effect for floating elements
      const parallax = document.querySelectorAll('.floating-circle');
      parallax.forEach((circle, index) => {
        const speed = 0.5 + (index * 0.2);
        circle.style.transform = `translateY(${scrolled * speed}px) rotate(${scrolled * 0.1}deg)`;
      });
    });

    // Intersection Observer for scroll animations
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);

    // Observe elements for scroll animations
    document.addEventListener('DOMContentLoaded', () => {
      const scrollElements = document.querySelectorAll('.scroll-fade');
      scrollElements.forEach(el => observer.observe(el));
    });

    // Add hover effects to contact cards
    document.querySelectorAll('.contact-card').forEach(card => {
      card.addEventListener('mouseenter', () => {
        card.style.transform = 'translateY(-10px) scale(1.02)';
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = 'translateY(0) scale(1)';
      });
    });

    // Add click animation to social links
    document.querySelectorAll('.social-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        link.style.transform = 'scale(0.9)';
        setTimeout(() => {
          link.style.transform = 'scale(1.1)';
          setTimeout(() => {
            link.style.transform = 'scale(1)';
            // Navigate to the actual link after animation
            window.open(link.href, '_blank');
          }, 150);
        }, 100);
      });
    });

    // Mouse movement parallax
    document.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX / window.innerWidth;
      const mouseY = e.clientY / window.innerHeight;

      document.querySelectorAll('.floating-circle').forEach((circle, index) => {
        const speed = (index + 1) * 2;
        const x = (mouseX - 0.5) * speed;
        const y = (mouseY - 0.5) * speed;
        circle.style.transform += ` translate(${x}px, ${y}px)`;
      });
    });
  </script>
</body>

</html>
